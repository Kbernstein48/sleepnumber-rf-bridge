[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepnumber-rf-bridge"
version = "0.1.1"
description = "Local RF bridge and Home Assistant integration for compatible Sleep Number 360 foundations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiohttp==3.13.5", "bellows==0.49.2", "zigpy==1.5.1"]

[project.scripts]
sleepnumber-rf = "sleepnumber_rf.server:main"

[tool.setuptools.packages.find]
include = ["sleepnumber_rf*"]

[tool.setuptools.package-data]
sleepnumber_rf = ["web/*.html"]
